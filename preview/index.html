<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shouzhuo · 油墨拼贴</title>
<meta name="description" content="思源宋体的油墨印刷质感，剪纸拼贴的纸条，定格动画的入场。">
<style>
  :root {
    --panel: #f6f5f2; --card: #ffffff; --line: #e5e1d9; --line-strong: #d6d0c5;
    --text: #24211d; --muted: #8e887e; --accent: #a8452b; --accent-soft: rgba(168, 69, 43, .12);
    --track: #e2ddd4; --radius: 10px;
    --serif: "InkSerif", "Songti SC", "Noto Serif SC", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: 100vh;
    background: #fff; color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* ---------- stage: a 1920 x 1080 composition, scaled to fit ---------- */
  #stage { position: relative; overflow: hidden; background: #fff; }
  #out { position: absolute; display: block; }
  #frame {
    position: absolute; pointer-events: none; border: 1px dashed transparent; transition: border-color .2s;
  }
  body.show-frame #frame { border-color: #d9d3c8; }
  #frame span {
    position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: var(--muted); opacity: 0; transition: opacity .2s;
  }
  body.show-frame #frame span { opacity: 1; }

  /* ---------- panel ---------- */
  aside {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-left: 1px solid var(--line);
  }
  .scroll { flex: 1; overflow-y: auto; padding: 22px 20px 20px; }
  header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 20px; }
  header h1 { margin: 0; font: 600 19px/1 var(--serif); letter-spacing: .06em; }
  header small { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }

  section { margin-bottom: 22px; }
  .label { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; font-weight: 600; font-size: 12.5px; }
  .label output, .label em { font-weight: 400; font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }

  /* tiles: styles and entries */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile {
    position: relative; display: block; width: 100%; padding: 0; overflow: hidden; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .tile:hover { border-color: var(--line-strong); box-shadow: 0 3px 10px rgba(36, 33, 29, .07); transform: translateY(-1px); }
  .tile:active { transform: translateY(0); }
  .tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .tile canvas { display: block; width: 100%; }
  .tile .name {
    position: absolute; left: 10px; bottom: 7px; font: 13px/1 var(--serif); color: var(--text); letter-spacing: .04em;
  }
  .styles canvas { height: 62px; }
  .entries canvas { height: 70px; }
  .tile { padding-bottom: 24px; }

  textarea {
    width: 100%; min-height: 76px; resize: vertical; padding: 9px 11px;
    font: 15px/1.55 var(--serif); color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius); outline: none;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .hint { margin: 6px 0 0; color: var(--muted); font-size: 11.5px; }
  .hint code { font-family: var(--serif); color: var(--text); background: #ece8e0; padding: 0 4px; border-radius: 3px; }

  /* sliders */
  .slider + .slider { margin-top: 14px; }
  input[type=range] {
    --p: 50%;
    -webkit-appearance: none; appearance: none; width: 100%; height: 18px; margin: 0; background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), var(--track) var(--p));
  }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), var(--track) var(--p)); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%;
    background: #fff; border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .15);
  }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }
  .ends { display: flex; justify-content: space-between; margin-top: 2px; color: var(--muted); font-size: 11px; }

  /* cut again: scissors */
  .recut {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    font: 14px/1 var(--serif); letter-spacing: .04em; cursor: var(--scissors, pointer);
    transition: border-color .15s, color .15s;
  }
  .recut:hover { border-color: var(--line-strong); color: var(--accent); }
  .recut svg { width: 18px; height: 18px; overflow: visible; }
  .recut .blade { transform-origin: 12px 12px; transform-box: view-box; }
  .recut.snip .b1 { animation: snip1 .4s steps(6) 1; }
  .recut.snip .b2 { animation: snip2 .4s steps(6) 1; }
  @keyframes snip1 { 50% { transform: rotate(14deg); } }
  @keyframes snip2 { 50% { transform: rotate(-14deg); } }

  /* export dock */
  .dock { position: relative; padding: 14px 20px 18px; border-top: 1px solid var(--line); background: var(--panel); }
  .primary {
    position: relative; overflow: hidden; width: 100%; padding: 12px; border: 0; border-radius: var(--radius);
    background: var(--text); color: #fff; font-weight: 600; letter-spacing: .08em; cursor: pointer;
    transition: background .15s;
  }
  .primary:hover { background: #3a352f; }
  .primary:disabled { cursor: progress; background: #3a352f; }
  .primary .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); transition: width .1s; }
  .primary span { position: relative; }
  .menu {
    position: absolute; left: 20px; right: 20px; bottom: calc(100% - 6px); padding: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(36, 33, 29, .14);
  }
  .menu button {
    display: block; width: 100%; padding: 10px 12px; text-align: left; border: 0; border-radius: 8px; background: none; cursor: pointer;
  }
  .menu button:hover { background: #f3f0ea; }
  .menu b { display: block; font-size: 13.5px; }
  .menu span { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; }
  #msg { margin: 8px 0 0; color: var(--accent); font-size: 11.5px; min-height: 0; }
  #msg:empty { display: none; }

  [hidden] { display: none !important; }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 46vh auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .scroll { overflow: visible; }
  }
</style>
</head>
<body>
<main id="stage">
  <canvas id="out"></canvas>
  <div id="frame"><span>导出范围 · 3840 × 2160</span></div>
</main>

<aside>
  <div class="scroll">
    <header><h1>油墨拼贴</h1><small>Ink Collage</small></header>

    <section>
      <p class="label">风格</p>
      <div class="tiles styles" id="styles"></div>
    </section>

    <section>
      <p class="label">文字</p>
      <textarea id="text" spellcheck="false" aria-label="文字"></textarea>
      <p class="hint">用 <code>[ ]</code> 或 <code>【 】</code> 框住的字会贴上高亮纸片</p>
    </section>

    <section>
      <div class="slider">
        <p class="label"><label for="size">字号</label><output id="sizeOut"></output></p>
        <input type="range" id="size" min="24" max="200" step="1">
      </div>
      <div class="slider">
        <p class="label"><label for="shape">字形</label><output id="shapeOut"></output></p>
        <input type="range" id="shape" min="0" max="100" step="1">
        <div class="ends"><span>原字形</span><span>圆、毛、晕开</span></div>
      </div>
      <div class="slider">
        <p class="label"><label for="texture">纹理</label><output id="textureOut"></output></p>
        <input type="range" id="texture" min="0" max="100" step="1">
        <div class="ends"><span>纯色</span><span>最旧</span></div>
      </div>
    </section>

    <section>
      <p class="label">入场 <em>悬停预览 · 点击播放</em></p>
      <div class="tiles entries" id="entries"></div>
    </section>

    <button class="recut" id="recut" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <!-- scissors: Lucide (ISC), split into two blades so they can snip -->
        <g class="blade b1"><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88"/></g>
        <g class="blade b2"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M14.8 14.8 20 20"/></g>
      </svg>
      换一种剪法
    </button>
  </div>

  <div class="dock">
    <div class="menu" id="menu" hidden>
      <button type="button" data-kind="image"><b>图片</b><span>PNG · 透明底 · 3840 × 2160</span></button>
      <button type="button" data-kind="video"><b id="videoTitle">视频</b><span>MOV · 透明底 · 无损 · 3840 × 2160 · 30 帧 · 含音效</span></button>
    </div>
    <button class="primary" id="exportBtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="exportLabel">导出</span><i class="bar" id="bar"></i></button>
    <p id="msg"></p>
  </div>
</aside>

<script type="module" src="./app.js"></script>
</body>
</html>
